<!doctype html>
<html lang="en">
<head>

<style>
/* The game's own menu fonts (SIL Open Font License, licenses in fonts/). */
@font-face { font-family: "Knewave"; src: url("fonts/Knewave-Regular.ttf") format("truetype"); font-weight: 400; font-style: normal; font-display: block; }
@font-face { font-family: "Saira"; src: url("fonts/Saira-BlackItalic.ttf") format("truetype"); font-weight: 900; font-style: italic; font-display: block; }
@font-face { font-family: "Saira"; src: url("fonts/Saira-ExtraBoldItalic.ttf") format("truetype"); font-weight: 800; font-style: italic; font-display: block; }
:root {
  color-scheme: dark;
  /* The game's menu colors (docs/menus/chrome_tv in the game's repo). */
  --ink: #0B1A4A; --cob: #1848D8; --navy: #001C7A; --navy-d: #000D4D; --orange: #FF6A13;
  --chrome: conic-gradient(from 200deg, #fff 0deg, #c3ccd9 40deg, #8a96ab 85deg, #eef2f7 125deg, #fff 160deg, #aeb8c8 210deg, #76829a 255deg, #dfe5ee 305deg, #fff 360deg);
  --aqua: linear-gradient(180deg, #FAFDFD 0%, #FAFDFD 36%, #C6F6FB 36%, #B3F3F9 44%, #62EAFC 56%, #0CD8FD 68%, #02C7FC 80%, #0097EE 100%);
  --gold: linear-gradient(180deg, #FFFFF0 0%, #FFFDE0 36%, #FFF59A 36%, #FFEE55 46%, #FFE000 62%, #FFCB00 82%, #FFA800 100%);
  /* Where the words start: just under the logo in the water. The logo ends
     18% down the video, which fills the height on phones and the width on
     wider windows. */
  --below-logo: max(20vh, 37vw);
  --col: 380px;
}
* { box-sizing: border-box; }
html { background: #0a86d2; }
body {
  margin: 0; min-height: 100vh; color: #fff; background: #0a86d2;
  font: 17px/1.4 "Saira", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-style: italic; font-weight: 800;
}
/* The rippling water behind the whole page: the logo on it, skis driving over it. */
.water { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #27a9e8; }
.water img, .water video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center top; }
/* Deeper water under the buttons, never over the logo. */
.water::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,40,90,0) 0, rgba(5,40,90,0) calc(var(--below-logo) - 8vh), rgba(5,40,90,0.32) calc(var(--below-logo) + 14vh), rgba(5,40,90,0.42) 100%); }
main {
  position: relative; z-index: 1; max-width: var(--col); margin: 0 auto;
  padding-block: var(--below-logo) 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  text-align: center;
}
/* Logo lettering: gradient fill with a hard gloss band, navy outline, cobalt extrusion. */
.lt { position: relative; display: inline-block; font-family: "Knewave", "Arial Black", sans-serif; font-style: normal; font-weight: 400; line-height: 1; white-space: nowrap; }
.lt > span { display: block; }
.lt > .o { color: var(--navy); -webkit-text-stroke: 0.17em var(--navy); text-shadow: 0.8px 1px 0 #0035A2, 1.6px 2px 0 #0035A2, 2.4px 3px 0 #061857, 3.2px 4px 0 #061857, 4.4px 5.5px 0 var(--navy-d); }
.lt > .f { position: absolute; inset: 0; background: var(--aqua); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lt.gold > .f { background: var(--gold); -webkit-background-clip: text; background-clip: text; }
h1 { position: relative; margin: 0 0 6px; font-weight: 400; font-style: normal; line-height: 1.05; }
h1 .lt { font-size: clamp(26px, 7.6vw, 34px); }
h1 .lt.gold { font-size: clamp(34px, 10vw, 46px); margin-top: 0.1em; }
h1 .line { display: block; }
.streak { display: block; width: min(62%, 260px); height: 14px; margin: 2px auto 10px; }
/* Small orange label, like the game's "STADIUM HARBOR BEST". */
.label { display: block; margin: 0 0 10px; font-family: "Saira", sans-serif; font-style: italic; font-weight: 900; font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--orange); paint-order: stroke fill; -webkit-text-stroke: 3px #fff; text-shadow: 0 2px 0 var(--navy); }
.label.sec { margin: 22px 0 10px; }
/* The game's cap buttons: chrome rim, colored face, ink outline, hard drop shadow; they press in. */
.cap {
  position: relative; display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; height: 66px; margin: 0 0 14px; border-radius: 999px; text-decoration: none; color: inherit;
  background: var(--chrome); box-shadow: 0 0 0 2.5px var(--ink), 0 6px 0 2.5px var(--ink), 0 14px 22px rgba(11,26,74,0.3);
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; touch-action: manipulation;
  transition: transform .24s cubic-bezier(.3,1.9,.5,1), box-shadow .24s, filter .24s;
}
.cap::before { content: ""; position: absolute; inset: 0; border-radius: 999px; background: linear-gradient(180deg, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0) 45%, rgba(11,26,74,0) 60%, rgba(11,26,74,0.28) 100%); }
.cap .in { position: absolute; inset: 6px; border-radius: 999px; overflow: hidden; background: linear-gradient(180deg, #FFF7A8 0%, #FFE000 46%, #FFC400 100%); box-shadow: 0 0 0 2px var(--ink), inset 0 3px 0 rgba(255,255,255,0.75), inset 0 -5px 8px rgba(214,128,0,0.35); }
.cap .in::after { content: ""; position: absolute; top: -20%; bottom: -20%; left: -40%; width: 18%; transform: skewX(-20deg); background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.8), rgba(255,255,255,0)); animation: sh 3.6s ease-in-out infinite; }
.cap.wh .in { background: linear-gradient(180deg, #ffffff 0%, #eefaff 50%, #c4ecfc 100%); box-shadow: 0 0 0 2px var(--ink), inset 0 3px 0 #fff, inset 0 -5px 8px rgba(10,134,210,0.2); }
.cap.wh .in::after { display: none; }
.cap > * { position: relative; }
.cap .in { position: absolute; }
.cap .lt { font-size: 26px; }
.cap svg { width: 26px; height: 26px; flex: none; fill: var(--ink); filter: drop-shadow(0 1px 0 rgba(255,255,255,0.6)); }
.cap .w { font-family: "Saira", sans-serif; font-style: italic; font-weight: 900; font-size: 18px; letter-spacing: 0.02em; color: var(--cob); text-transform: uppercase; }
.cap .w small { font-size: 12px; font-weight: 800; color: var(--ink); opacity: 0.75; margin-left: 4px; }
a.cap:active { transform: translateY(5px); filter: brightness(0.93); box-shadow: 0 0 0 2.5px var(--ink), 0 1px 0 2.5px var(--ink); transition: transform .05s ease-out, filter .05s, box-shadow .05s; }
.row { display: flex; gap: 14px; }
.row .cap { height: 52px; margin: 0; }
.soon { height: 52px; opacity: 0.92; }
.hide { display: none !important; }
@keyframes sh { 0%, 60% { left: -40%; } 100% { left: 130%; } }
/* Sparkles, like the logo's star. */
.spk { position: absolute; width: 22px; height: 22px; animation: twk 2.4s ease-in-out infinite; pointer-events: none; }
@keyframes twk { 0%, 70%, 100% { opacity: 1; } 80% { opacity: 0.35; } }
footer { position: relative; z-index: 1; font-size: 13px; padding: 10px 16px calc(26px + env(safe-area-inset-bottom, 0px)); text-align: center; color: #fff; paint-order: stroke fill; -webkit-text-stroke: 2.5px var(--ink); }
footer a { color: #fff; }
/* Wide windows: the logo stays on the water left of center, the words and buttons stand to its right. */
@media (min-aspect-ratio: 11/10) and (min-width: 900px) {
  :root { --col: min(400px, 27vw); }
  .water::after { background: linear-gradient(90deg, rgba(5,40,90,0) 55%, rgba(5,40,90,0.3) 72%, rgba(5,40,90,0.42) 100%); }
  main { margin: 0 0 0 70%; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding-block: 24px 64px; }
  h1 .lt { font-size: clamp(26px, 2.4vw, 36px); }
  h1 .lt.gold { font-size: clamp(34px, 3.2vw, 48px); }
  footer { position: fixed; left: 0; right: 0; bottom: 0; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
}
/* Tall enough screens keep the footer on the bottom edge. */
@media (min-height: 760px) { footer { position: fixed; left: 0; right: 0; bottom: 0; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); } }
@media (prefers-reduced-motion: reduce) { .water video { display: none; } .cap .in::after, .spk { animation: none; } }
</style>
</head>
<body>
<div class="water" aria-hidden="true">
  <img id="poster" src="water_720_poster.jpg" alt="">
  <video id="water" autoplay muted loop playsinline disablepictureinpicture preload="auto"></video>
</div>
<main>
  <h1 aria-label="TurboTide. Hit the throttle like it's 2001.">
    <svg class="spk" viewBox="0 0 24 24" aria-hidden="true" style="left:-4px;top:-14px;"><path d="M12 .5C12.9 8 15.8 11 23.5 12 15.8 13 12.9 16 12 23.5 11.1 16 8.2 13 .5 12 8.2 11 11.1 8 12 .5Z" fill="#FDFD95" stroke="#001C7A" stroke-width="1.1" stroke-linejoin="round"/><path d="M12 6.5C12.4 10 13.9 11.5 17.4 12 13.9 12.5 12.4 14 12 17.5 11.6 14 10.1 12.5 6.6 12 10.1 11.5 11.6 10 12 6.5Z" fill="#fff"/></svg>
    <svg class="spk" viewBox="0 0 24 24" aria-hidden="true" style="right:-6px;bottom:-4px;width:16px;height:16px;animation-delay:1.1s;"><path d="M12 .5C12.9 8 15.8 11 23.5 12 15.8 13 12.9 16 12 23.5 11.1 16 8.2 13 .5 12 8.2 11 11.1 8 12 .5Z" fill="#FDFD95" stroke="#001C7A" stroke-width="1.1" stroke-linejoin="round"/><path d="M12 6.5C12.4 10 13.9 11.5 17.4 12 13.9 12.5 12.4 14 12 17.5 11.6 14 10.1 12.5 6.6 12 10.1 11.5 11.6 10 12 6.5Z" fill="#fff"/></svg>
    <span class="line"><span class="lt"><span class="o">HIT THE THROTTLE</span><span class="f" aria-hidden="true">HIT THE THROTTLE</span></span></span>
    <span class="line"><span class="lt gold"><span class="o">LIKE IT'S 2001</span><span class="f" aria-hidden="true">LIKE IT'S 2001</span></span></span>
  </h1>
  <svg class="streak" viewBox="0 0 260 16" aria-hidden="true"><path d="M4 14L259 4L245 16Z" fill="#0B1A4A"/><path d="M2 12L257 2L243 14Z" fill="#FFE000" stroke="#0B1A4A" stroke-width="2" stroke-linejoin="round"/><path d="M109 9.9L245 5" stroke="#FFFBD0" stroke-width="2" stroke-linecap="round"/></svg>
  <span class="label">Out now on iPhone</span>

  <a class="cap" id="ios" href="https://apps.apple.com/app/id6816707770">
    <span class="in"></span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.4 12.6c0-2.4 2-3.6 2.1-3.7-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8-1.6 0-3.1 1-4 2.4-1.7 3-.4 7.3 1.2 9.7.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.2-.8s1.9.8 3.2.8 2.2-1.2 3-2.4c.9-1.4 1.3-2.7 1.3-2.8 0 0-2.6-1-2.6-3.8zM14 5.4c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1 .1 2.1-.6 2.8-1.4z"/></svg>
    <span class="lt"><span class="o">GET IT ON iPHONE</span><span class="f" aria-hidden="true">GET IT ON iPHONE</span></span>
  </a>
  <a class="cap hide" id="android" href="">
    <span class="in"></span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.6 2.3 13.5 12l-9.9 9.7c-.4-.2-.6-.6-.6-1.1V3.4c0-.5.2-.9.6-1.1zm11.3 11.1 2.7 2.7-10.4 6 7.7-8.7zm0-2.8L7.2 1.9l10.4 6-2.7 2.7zm1.4 1.4 3.2-1.8c.9-.5.9-1.9 0-2.4l-3.2-1.8L13.5 9l2.8 3z"/></svg>
    <span class="lt"><span class="o">GET IT ON ANDROID</span><span class="f" aria-hidden="true">GET IT ON ANDROID</span></span>
  </a>
  <a class="cap hide" id="steam" href=""><span class="in"></span><span class="lt"><span class="o">WISHLIST ON STEAM</span><span class="f" aria-hidden="true">WISHLIST ON STEAM</span></span></a>
  <div class="row">
    <span class="cap wh soon" id="android-soon"><span class="in"></span><span class="w">Android <small>soon</small></span></span>
    <span class="cap wh soon" id="steam-soon"><span class="in"></span><span class="w">Steam <small>soon</small></span></span>
  </div>

  <span class="label sec">Follow the racing</span>
  <div class="row">
    <a class="cap wh" href="https://www.tiktok.com/@turbotidegame"><span class="in"></span><span class="w">TikTok</span></a>
    <a class="cap wh" href="https://www.instagram.com/turbotidegame/"><span class="in"></span><span class="w">Instagram</span></a>
  </div>
</main>
<footer>
  &copy; 2026 Bungalow Studios LLC &middot; <a href="https://turbotidegame.github.io/support.html">Support</a> &middot; <a href="https://turbotidegame.github.io/privacy.html">Privacy</a>
</footer>
<script>
// The one link for every bio. The page works out where the visitor came
// from and hands them a store link that says so, so each store can report
// downloads by source. Nothing is stored and nothing is sent from this page.
(function () {
  var q = new URLSearchParams(location.search);
  var tag = (q.get("s") || q.get("utm_source") || "").toLowerCase().replace(/[^a-z0-9_]/g, "").slice(0, 24);
  // A ?s= tag wins (?s=tiktok, ?s=ig). Without one, the app that opened the
  // page gives it away: Instagram and TikTok open bio links in their own
  // browsers, which name themselves in the user agent (and Instagram also
  // in the referrer), so the bio can be the plain address.
  var NAMES = { tiktok: "tiktok", ig: "instagram", instagram: "instagram" };
  var ua = navigator.userAgent || "", ref = document.referrer || "";
  var guess = /Instagram/i.test(ua) || /instagram\.com/i.test(ref) ? "instagram"
    : /TikTok|Bytedance|musical_ly/i.test(ua) || /tiktok\.com/i.test(ref) ? "tiktok" : "";
  var s = NAMES[tag] || tag || guess || "bungalow_page";
  // Apple: App Store Connect > App Analytics > campaign links. PT is the
  // team's provider token (the same in every link made there); the campaign
  // name is the source, so Analytics > Acquisition > Campaigns lists tiktok,
  // instagram and bungalow_page by name once each has 5 or more installs.
  var PT = "128362562";
  var ios = document.getElementById("ios");
  if (PT) ios.href = "https://apps.apple.com/app/apple-store/id6816707770?pt=" + PT + "&ct=" + s + "&mt=8";
  // Google Play: the listing once it is public ("" = not out yet), e.g.
  // "https://play.google.com/store/apps/details?id=com.bungalowstudios.turbotide".
  // The referrer tag shows in Play Console under acquisition (UTM).
  var PLAY = "";
  var and = document.getElementById("android"), andSoon = document.getElementById("android-soon");
  if (PLAY) {
    and.href = PLAY + (PLAY.indexOf("?") < 0 ? "?" : "&") + "referrer=" + encodeURIComponent("utm_source=" + s + "&utm_medium=bio");
    and.classList.remove("hide"); andSoon.classList.add("hide");
  }
  // Steam: the store page once it exists. Steam reports UTM tags in
  // Steamworks (Marketing & Visibility > UTM analytics).
  var STEAM = "";
  var st = document.getElementById("steam"), stSoon = document.getElementById("steam-soon");
  if (STEAM) {
    st.href = STEAM + (STEAM.indexOf("?") < 0 ? "?" : "&") + "utm_source=" + s + "&utm_medium=bio";
    st.classList.remove("hide"); stSoon.classList.add("hide");
  }
  // Android visitors see the Android button first once it exists.
  if (PLAY && /Android/i.test(ua)) ios.parentNode.insertBefore(and, ios);
  // The water: the sharper file on big screens. The still behind it covers
  // the moment before the video plays, and phones in Low Power Mode, which
  // start it on the first tap.
  var big = window.innerWidth >= 900;
  var v = document.getElementById("water"), poster = document.getElementById("poster");
  poster.src = big ? "water_1080_poster.jpg" : "water_720_poster.jpg";
  v.poster = poster.src;
  v.src = big ? "water_1080.mp4" : "water_720.mp4";
  document.addEventListener("touchend", function () { if (v.paused) v.play().catch(function () {}); }, { passive: true });
})();
</script>
