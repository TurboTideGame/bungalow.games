<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07131f">
<title>Play TurboTide</title>
<meta name="description" content="TurboTide: retro arcade watercraft racing. Out now on iPhone. Android and Steam are on the way.">
<link rel="canonical" href="https://bungalow.games/turbotide/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Bungalow Studios">
<meta property="og:url" content="https://bungalow.games/turbotide/">
<meta property="og:title" content="Play TurboTide">
<meta property="og:description" content="Retro arcade watercraft racing. Out now on iPhone.">
<meta property="og:image" content="https://turbotidegame.github.io/race/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
:root {
  color-scheme: dark;
  --bg: #07131f; --card: rgba(9, 26, 42, 0.78); --text: #e6f2fa; --muted: #a3b8cb;
  --accent: #4cc3ff; --accent2: #00d2c8; --line: rgba(120, 190, 240, 0.28);
  --gold: #f5b200; --gold2: #ffd54a;
  /* The water shot is 9:16. On phones it is shown full width, so its logo
     sits about 34% to 51% of the way down a frame 177.8vw tall. */
  --hero: 93vw;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; min-height: 100vh; color: var(--text); background: var(--bg);
  font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
/* The rippling water with the logo, behind everything. */
.water { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: var(--bg) url("water_poster.jpg") top center / 100% auto no-repeat; }
.water video { display: block; width: 100%; height: auto; }
/* Fades the water into the page below the logo, so the buttons read well. */
.water::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(7,19,31,0) 0, rgba(7,19,31,0) calc(var(--hero) - 16vw), rgba(7,19,31,0.72) var(--hero), rgba(7,19,31,0.86) 100%);
}
@media (orientation: landscape) {
  /* Wide screens: the shot fills the window with its logo near the top,
     and the buttons sit under it. */
  :root { --hero: 66vh; }
  .water { background-size: cover; background-position: center 45%; }
  .water video { width: 100%; height: 100%; object-fit: cover; object-position: center 45%; }
  .water::after { background: linear-gradient(180deg, rgba(7,19,31,0) 0, rgba(7,19,31,0) 50vh, rgba(7,19,31,0.72) var(--hero), rgba(7,19,31,0.86) 100%); }
}
@media (prefers-reduced-motion: reduce) { .water video { display: none; } }
main {
  position: relative; z-index: 1; max-width: 440px; margin: 0 auto;
  padding-block: calc(var(--hero) + env(safe-area-inset-top, 0px)) 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  text-align: center;
}
h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); margin: 0; }
.tag { color: #fff; margin: 0 0 16px; font-size: 18px; font-weight: 700; letter-spacing: 0.01em; text-shadow: 0 1px 3px rgba(0,20,40,0.6), 0 0 18px rgba(0,40,80,0.5); }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px 16px; margin: 0 0 14px;
  box-shadow: 0 10px 30px rgba(0,10,25,0.35); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
h2 { margin: 0 0 12px; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; margin: 0 0 10px; padding: 15px 18px; border-radius: 999px;
  background: linear-gradient(180deg, var(--accent2), var(--accent)); color: #04121f;
  font-weight: 800; font-size: 18px; text-decoration: none;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 3px 10px rgba(0,0,0,0.3);
}
.btn:last-child { margin-bottom: 0; }
.btn.gold { background: linear-gradient(180deg, var(--gold2), var(--gold)); color: #2a1d00; }
.btn.soon { background: transparent; color: var(--muted); border: 2px dashed var(--line); box-shadow: none; font-weight: 700; pointer-events: none; }
.btn.soon small { font-weight: 500; opacity: 0.85; }
.btn svg { width: 22px; height: 22px; flex: none; fill: currentColor; }
.row { display: flex; gap: 10px; }
.row .btn { margin: 0; padding: 12px; font-size: 16px; background: transparent; color: var(--accent); border: 2px solid var(--accent); box-shadow: none; }
.hide { display: none !important; }
footer { position: relative; z-index: 1; color: var(--muted); font-size: 14px; padding: 8px 16px calc(36px + env(safe-area-inset-bottom, 0px)); text-align: center; }
footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="water" aria-hidden="true">
  <video autoplay muted loop playsinline disablepictureinpicture preload="auto" poster="water_poster.jpg">
    <source src="water_loop.mp4" type="video/mp4">
  </video>
</div>
<main>
  <h1>TurboTide</h1>
  <p class="tag">Retro arcade watercraft racing.</p>

  <section class="card">
    <h2>Play it</h2>
    <a class="btn" id="ios" href="https://apps.apple.com/app/id6816707770">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.4 12.6c0-2.4 2-3.6 2.1-3.7-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8-1.6 0-3.1 1-4 2.4-1.7 3-.4 7.3 1.2 9.7.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.2-.8s1.9.8 3.2.8 2.2-1.2 3-2.4c.9-1.4 1.3-2.7 1.3-2.8 0 0-2.6-1-2.6-3.8zM14 5.4c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1 .1 2.1-.6 2.8-1.4z"/></svg>
      Get it on iPhone
    </a>
    <a class="btn hide" id="android" href="">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.6 2.3 13.5 12l-9.9 9.7c-.4-.2-.6-.6-.6-1.1V3.4c0-.5.2-.9.6-1.1zm11.3 11.1 2.7 2.7-10.4 6 7.7-8.7zm0-2.8L7.2 1.9l10.4 6-2.7 2.7zm1.4 1.4 3.2-1.8c.9-.5.9-1.9 0-2.4l-3.2-1.8L13.5 9l2.8 3z"/></svg>
      Get it on Android
    </a>
    <span class="btn soon" id="android-soon">Android <small>&middot; coming soon</small></span>
    <a class="btn gold hide" id="steam" href="">Wishlist on Steam</a>
    <span class="btn soon" id="steam-soon">Steam <small>&middot; coming soon</small></span>
  </section>

  <section class="card">
    <h2>Follow the racing</h2>
    <div class="row">
      <a class="btn" href="https://www.tiktok.com/@turbotidegame">TikTok</a>
      <a class="btn" href="https://www.instagram.com/turbotidegame/">Instagram</a>
    </div>
  </section>
</main>
<footer>
  &copy; 2026 Bungalow Studios LLC &middot; <a href="https://turbotidegame.github.io/support.html">Support</a> &middot; <a href="https://turbotidegame.github.io/privacy.html">Privacy</a>
</footer>
<script>
// The one link for every bio. Each bio points here with its own tag
// (?s=tiktok, ?s=ig, ?s=yt ...), and this page hands the visitor a store
// link carrying that tag, so each store can say where its downloads came from.
// Nothing is stored and nothing is sent from this page itself.
(function () {
  var q = new URLSearchParams(location.search);
  var tag = (q.get("s") || q.get("utm_source") || "").toLowerCase().replace(/[^a-z0-9_]/g, "").slice(0, 24);
  // The campaign name each tag maps to (the bios use ?s=tiktok and ?s=ig).
  var NAMES = { tiktok: "tiktok", ig: "instagram", instagram: "instagram" };
  var s = NAMES[tag] || tag || "bungalow_page";
  // Apple: App Store Connect > App Analytics > campaign links. PT is the
  // team's provider token (the same in every link made there); the campaign
  // name is the tag, so Analytics > Acquisition > Campaigns lists tiktok,
  // instagram and bungalow_page by name once each has 5 or more installs.
  var PT = "128362562";
  var ios = document.getElementById("ios");
  if (PT) ios.href = "https://apps.apple.com/app/apple-store/id6816707770?pt=" + PT + "&ct=" + s + "&mt=8";
  // Google Play: the listing once it is public ("" = not out yet), e.g.
  // "https://play.google.com/store/apps/details?id=com.bungalowstudios.turbotide".
  // The referrer tag shows in Play Console under acquisition (UTM).
  var PLAY = "";
  var and = document.getElementById("android"), andSoon = document.getElementById("android-soon");
  if (PLAY) {
    and.href = PLAY + (PLAY.indexOf("?") < 0 ? "?" : "&") + "referrer=" + encodeURIComponent("utm_source=" + s + "&utm_medium=bio");
    and.classList.remove("hide"); andSoon.classList.add("hide");
  }
  // Steam: the store page once it exists. Steam reports UTM tags in
  // Steamworks (Marketing & Visibility > UTM analytics).
  var STEAM = "";
  var st = document.getElementById("steam"), stSoon = document.getElementById("steam-soon");
  if (STEAM) {
    st.href = STEAM + (STEAM.indexOf("?") < 0 ? "?" : "&") + "utm_source=" + s + "&utm_medium=bio";
    st.classList.remove("hide"); stSoon.classList.add("hide");
  }
  // Android visitors see the Android button first once it exists.
  if (PLAY && /Android/i.test(navigator.userAgent || "")) ios.parentNode.insertBefore(and, ios);
  // Phones in Low Power Mode don't autoplay: a tap anywhere starts the water.
  var v = document.querySelector(".water video");
  if (v) document.addEventListener("touchend", function () { if (v.paused) v.play().catch(function () {}); }, { passive: true });
})();
</script>
</body>
</html>
